name: checker
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.idea/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.idea/**']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked extension helpers (capture only from the default branch)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: make base-check

  netem-extension:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: make extension-test
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Log in for cache writes or image publication
        uses: docker/login-action@v3
        if: inputs.publish || (github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the helper
        env:
          BUILD_CACHE_REF: ghcr.io/jsyoo5b/ceph-testcontainers-images:buildcache-netem-${{ matrix.architecture }}
          BUILD_CACHE_WRITE: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: make extension-images PLATFORM="linux/${{ matrix.architecture }}" IMAGE_REPOSITORY=ceph-check
      - name: Check the contract, the kernel, a delay, the selectors, the rate and the packet faults in Ceph targets
        run: |
          targets=()
          for release in $(python3 image/releases.py list); do
            for reference in "$(python3 image/releases.py official "$release")" \
                "$(python3 image/releases.py role "$release" official essential)"; do
              docker pull --platform "linux/${{ matrix.architecture }}" "$reference"
              targets+=(--target "$reference")
            done
          done
          selectors=()
          for profile in $(make --no-print-directory extension-selectors); do
            selectors+=(--selector "$profile")
          done
          python3 image/extension_check.py --extension netem --image ceph-check:extension-netem \
            --platform "linux/${{ matrix.architecture }}" --functional "${targets[@]}" "${selectors[@]}" --rate --packet-faults \
            --output-dir "$RUNNER_TEMP/extension"
      - name: Upload the exact tested helper
        if: inputs.publish
        run: |
          python3 image/publish.py stage-extension --report "$RUNNER_TEMP/extension/extension-report.json" \
            --extension netem --architecture ${{ matrix.architecture }} \
            --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/extension/extension-candidate.json"
      - uses: actions/upload-artifact@v4
        if: inputs.publish
        with:
          name: extension-candidate-netem-${{ matrix.architecture }}
          retention-days: 30
          path: ${{ runner.temp }}/extension/extension-candidate.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-netem-${{ matrix.architecture }}-check
          retention-days: ${{ inputs.publish && 30 || job.status == 'failure' && 14 || 7 }}
          path: ${{ runner.temp }}/extension/
          if-no-files-found: warn

  capture-extension:
    # The packet-capture helper is built, checked quickly and functionally in
    # the namespace of each release's official image, and published only by a
    # manual run with publish on the default branch.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: make extension-test
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Log in for image publication
        uses: docker/login-action@v3
        if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the helper
        run: make capture-image PLATFORM="linux/${{ matrix.architecture }}" IMAGE_REPOSITORY=ceph-check
      - name: Check the capture contract and capture in Ceph targets' namespaces
        run: |
          targets=()
          for release in $(python3 image/releases.py list); do
            reference="$(python3 image/releases.py official "$release")"
            docker pull --platform "linux/${{ matrix.architecture }}" "$reference"
            targets+=(--target "$reference")
          done
          python3 image/extension_check.py --extension capture --image ceph-check:extension-capture \
            --platform "linux/${{ matrix.architecture }}" --functional --capture-experiments "${targets[@]}" \
            --output-dir "$RUNNER_TEMP/capture"
      - name: Keep raw captures out of the artifacts
        id: raw-captures
        if: always()
        run: python3 image/publish.py check-artifacts --directory "$RUNNER_TEMP/capture"
      - name: Upload the exact tested helper
        if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          python3 image/publish.py stage-extension --report "$RUNNER_TEMP/capture/extension-report.json" \
            --extension capture --architecture ${{ matrix.architecture }} \
            --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/capture-candidate/extension-candidate.json"
      - uses: actions/upload-artifact@v4
        if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          name: extension-candidate-capture-${{ matrix.architecture }}
          retention-days: 30
          path: ${{ runner.temp }}/capture-candidate/extension-candidate.json
          if-no-files-found: error
      # A report directory is uploaded only after the guard found no raw
      # capture in it, also after an earlier checker failure.
      - uses: actions/upload-artifact@v4
        if: always() && steps.raw-captures.outcome == 'success'
        with:
          name: extension-capture-${{ matrix.architecture }}-check
          retention-days: ${{ inputs.publish && 30 || job.status == 'failure' && 14 || 7 }}
          path: ${{ runner.temp }}/capture/
          if-no-files-found: warn

  clock-probe-extension:
    # The clock-probe helper has only its quick check so far; it is built and
    # checked here on both architectures and never published.
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Build the helper
        run: make clock-probe-image PLATFORM="linux/${{ matrix.architecture }}" IMAGE_REPOSITORY=ceph-check
      - name: Check the clock-probe contract
        run: |
          python3 image/extension_check.py --extension clock-probe --image ceph-check:extension-clock-probe \
            --platform "linux/${{ matrix.architecture }}" --output-dir "$RUNNER_TEMP/clock-probe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-clock-probe-${{ matrix.architecture }}-check
          retention-days: ${{ job.status == 'failure' && 14 || 7 }}
          path: ${{ runner.temp }}/clock-probe/
          if-no-files-found: warn

  promote-extension:
    if: inputs.publish
    needs: netem-extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      images: ${{ steps.promote.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: extension-candidate-netem-*
          path: ${{ runner.temp }}/extension-candidates
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Overwrite the helper tags with the tested digests
        id: promote
        run: |
          python3 image/publish.py promote-extension --extension netem --candidates "$RUNNER_TEMP/extension-candidates" \
            --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/extension-promotion/promotion.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-promotion
          retention-days: 30
          path: ${{ runner.temp }}/extension-promotion/
          if-no-files-found: warn

  verify-published-extension:
    if: inputs.publish
    needs: promote-extension
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/published-extension.yml
    with:
      extension: netem
      images: ${{ needs.promote-extension.outputs.images }}

  promote-capture-extension:
    # Both architectures' capture jobs must have passed and uploaded their own
    # tested helper; a failed platform uploads nothing and blocks promotion.
    if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: capture-extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      images: ${{ steps.promote.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: extension-candidate-capture-*
          path: ${{ runner.temp }}/capture-candidates
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Overwrite the helper tags with the tested digests
        id: promote
        run: |
          python3 image/publish.py promote-extension --extension capture --candidates "$RUNNER_TEMP/capture-candidates" \
            --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/capture-promotion/promotion.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-capture-promotion
          retention-days: 30
          path: ${{ runner.temp }}/capture-promotion/
          if-no-files-found: warn

  verify-published-capture-extension:
    if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: promote-capture-extension
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/published-extension.yml
    with:
      extension: capture
      images: ${{ needs.promote-capture-extension.outputs.images }}

name: checker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: make check

  # The official image must pass both the quick and the full check.
  official-image:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: quay.io/ceph/ceph:v20.2.4@sha256:6bb1c8a42fbc0bf87938946990b65174466997bc11c31eb5a323225a779fd8f9
    steps:
      - uses: actions/checkout@v4
      - run: docker pull "$IMAGE"
      - name: Quick check
        run: python3 image/check.py --image "all=$IMAGE" --output-dir "$RUNNER_TEMP/quick"
      - name: Full check
        run: python3 image/check.py --image "all=$IMAGE" --full --output-dir "$RUNNER_TEMP/full"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-check
          path: |
            ${{ runner.temp }}/quick/
            ${{ runner.temp }}/full/
          if-no-files-found: warn

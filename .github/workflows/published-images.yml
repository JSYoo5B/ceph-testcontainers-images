name: published images

on:
  workflow_call:
    inputs:
      images:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      images:
        description: 'JSON digest map: release -> variant -> architecture -> role -> sha256 digest, for the available catalogued cohorts'
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: make base-check

  releases:
    needs: unit
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan the available native cohorts of the given releases
        id: plan
        env:
          PUBLISHED_IMAGES: ${{ inputs.images }}
        run: |
          releases="$(python3 -c 'import json, os; images = json.loads(os.environ["PUBLISHED_IMAGES"]); assert images and isinstance(images, dict), "Provide a digest map"; print(",".join(sorted(images)))')"
          python3 image/releases.py plan --releases "$releases" --github-output "$GITHUB_OUTPUT"

  published-images:
    needs: releases
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.releases.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Pull published digests and check mixed roles and all
        env:
          PUBLISHED_IMAGES: ${{ inputs.images }}
          IMAGE_RELEASE: ${{ matrix.release }}
          IMAGE_VARIANT: ${{ matrix.variant }}
          IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          sys.path.insert(0, 'image')
          import releases
          images = json.loads(os.environ['PUBLISHED_IMAGES'])[os.environ['IMAGE_RELEASE']]
          cohorts = releases.cohorts(os.environ['IMAGE_RELEASE'])
          if set(images) != {variant for variant, _ in cohorts}:
              raise ValueError('Provide every catalogued image variant')
          for variant in images:
              architectures = {a for v, a in cohorts if v == variant}
              if set(images[variant]) != architectures:
                  raise ValueError('Provide exactly the available architectures of every variant')
              for architecture in architectures:
                  entries = images[variant][architecture]
                  if set(entries) != set(releases.roles(variant)):
                      raise ValueError('Provide every published role image of the variant for every platform')
                  if any(not isinstance(digest, str) or not re.fullmatch(r'sha256:[0-9a-f]{64}', digest)
                         for digest in entries.values()):
                      raise ValueError('Image references must be immutable sha256 digests')
          output = Path(os.environ['RUNNER_TEMP'])
          (output / 'published-digests.json').write_text(json.dumps(images, indent=2) + '\n')
          platform = 'linux/' + os.environ['IMAGE_ARCHITECTURE']
          entries = images[os.environ['IMAGE_VARIANT']][os.environ['IMAGE_ARCHITECTURE']]
          command = [sys.executable, 'image/check.py', '--platform', platform,
                     '--full', '--output-dir', str(output / 'published-check')]
          for role in releases.roles(os.environ['IMAGE_VARIANT']):
              reference = 'ghcr.io/jsyoo5b/ceph-testcontainers-images@' + entries[role]
              subprocess.run(['docker', 'pull', '--platform', platform, reference], check=True)
              command.extend(['--image', role + '=' + reference])
              if role == 'mgr-modules':
                  # Require the MGR module inventory the published image declares.
                  labels = json.loads(subprocess.run(['docker', 'image', 'inspect', '--format', '{{json .Config.Labels}}',
                                                      reference], check=True, capture_output=True, text=True).stdout)
                  for module in (labels or {}).get('io.ceph-testcontainers.mgr-modules', '').split():
                      command.extend(['--mgr-module', module])
          subprocess.run(command, check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-${{ matrix.release }}-${{ matrix.variant }}-${{ matrix.architecture }}-check
          retention-days: 30
          path: |
            ${{ runner.temp }}/published-digests.json
            ${{ runner.temp }}/published-check/
          if-no-files-found: warn

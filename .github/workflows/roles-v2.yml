name: roles-v2
on:
  pull_request:
    paths: ['image/**', 'Makefile', '.github/workflows/roles-v2.yml']
  push:
    branches: [main]
    paths: ['image/**', 'Makefile', '.github/workflows/roles-v2.yml']
  workflow_dispatch:
    inputs:
      release:
        type: choice
        options: ['20.2.4', '19.2.5']
        default: '20.2.4'
      publish:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Release publications use disjoint tags, so Squid and Tentacle can qualify independently.
  group: roles-v2-${{ github.event_name }}-${{ github.ref }}-${{ inputs.release || 'matrix' }}
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-24.04
    outputs:
      releases: ${{ steps.releases.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - run: make base-check
      - id: releases
        env:
          RELEASE: ${{ inputs.release }}
        run: python3 -c 'import json,os; print("value="+json.dumps([os.environ["RELEASE"]] if os.environ["RELEASE"] else ["20.2.4","19.2.5"]))' >> "$GITHUB_OUTPUT"
  build:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.unit.outputs.releases) }}
        variant: [official, debian, ubuntu]
        architecture: [amd64, arm64]
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: make roles-v2-images V2_VARIANT=${{ matrix.variant }} CEPH_RELEASE=${{ matrix.release }} PLATFORM=linux/${{ matrix.architecture }}
      - name: Full split and aggregate compatibility
        if: github.event_name == 'workflow_dispatch'
        env:
          VARIANT: ${{ matrix.variant }}
          RELEASE: ${{ matrix.release }}
        run: |
          args=()
          for role in essential client cephfs rbd-aux rgw all; do
            args+=(--image "$role=ceph-testcontainers:roles-v2-$VARIANT-$RELEASE-$role")
          done
          python3 image/check.py --contract roles-v2 "${args[@]}" --full --output-dir "$RUNNER_TEMP/v2-full"
          python3 image/check.py --contract roles-v2 --full --scenario rgw-multisite \
            --image "essential=ceph-testcontainers:roles-v2-$VARIANT-$RELEASE-essential" \
            --image "rgw=ceph-testcontainers:roles-v2-$VARIANT-$RELEASE-rgw" \
            --output-dir "$RUNNER_TEMP/v2-rgw-only"
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage exact tested image identities
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: >-
          python3 image/publish.py stage --contract roles-v2 --release ${{ matrix.release }}
          --report "$RUNNER_TEMP/v2-full/check-report.json" --variant ${{ matrix.variant }}
          --architecture ${{ matrix.architecture }} --revision "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/candidate/candidate.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roles-v2-${{ matrix.release }}-${{ matrix.variant }}-${{ matrix.architecture }}
          path: |
            artifacts/**/build-report.json
            artifacts/**/check-report.json
            artifacts/**/*.log
            ${{ runner.temp }}/v2-full
            ${{ runner.temp }}/v2-rgw-only
            ${{ runner.temp }}/candidate
          retention-days: 14
  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [unit, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: roles-v2-${{ inputs.release }}-*
          path: candidates
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: >-
          python3 image/publish.py promote --contract roles-v2 --release ${{ inputs.release }}
          --candidates candidates --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --output promotion.json
      - run: python3 image/publish.py health --contract roles-v2 --release ${{ inputs.release }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roles-v2-promotion
          path: promotion.json
          retention-days: 30

name: images
on:
  workflow_dispatch:
    inputs:
      release:
        type: choice
        options: ['20.2.4', '19.2.5']
        default: '20.2.4'
      publish:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Release publications use disjoint tags, so Squid and Tentacle can qualify independently.
  group: images-${{ github.event_name }}-${{ github.ref }}-${{ inputs.release || 'matrix' }}
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-24.04
    outputs:
      releases: ${{ steps.releases.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - run: make base-check
      - id: releases
        env:
          RELEASE: ${{ inputs.release }}
        run: python3 -c 'import json,os; print("value="+json.dumps([os.environ["RELEASE"]] if os.environ["RELEASE"] else ["20.2.4","19.2.5"]))' >> "$GITHUB_OUTPUT"
  build:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.unit.outputs.releases) }}
        variant: [official, debian, ubuntu]
        architecture: [amd64, arm64]
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 image/ci.py --release ${{ matrix.release }} --variant ${{ matrix.variant }} --architecture ${{ matrix.architecture }} --scope full --output "$RUNNER_TEMP/images"
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage exact tested image identities
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: >-
          python3 image/publish.py stage --release ${{ matrix.release }}
          --report "$RUNNER_TEMP/images/full/check-report.json" --variant ${{ matrix.variant }}
          --architecture ${{ matrix.architecture }} --revision "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/candidate/candidate.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: images-${{ matrix.release }}-${{ matrix.variant }}-${{ matrix.architecture }}
          path: |
            artifacts/**/build-report.json
            artifacts/**/check-report.json
            artifacts/**/*.log
            ${{ runner.temp }}/images
            ${{ runner.temp }}/candidate
          retention-days: 14
  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [unit, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: images-${{ inputs.release }}-*
          path: candidates
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: >-
          python3 image/publish.py promote --release ${{ inputs.release }}
          --candidates candidates --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --output promotion.json
      - run: python3 image/publish.py health --promotion promotion.json --release ${{ inputs.release }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: images-promotion
          path: promotion.json
          retention-days: 30

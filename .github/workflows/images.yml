name: images
on:
  workflow_dispatch:
    inputs:
      releases:
        type: string
        default: '20.2.4'
        description: 'all, or comma-separated releases from image/releases.json'
      publish:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Runs with the same selection queue; other selections build and check in
  # parallel. Staged candidates use run-unique tags, so only promotion shares
  # mutable tags, and the promote job serializes on its own.
  group: images-${{ github.event_name }}-${{ github.ref }}-${{ inputs.releases }}
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-24.04
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - run: make base-check
      - name: Plan the available native cohorts of the selected releases
        id: plan
        env:
          RELEASES: ${{ inputs.releases }}
        run: python3 image/releases.py plan --releases "$RELEASES" --github-output "$GITHUB_OUTPUT"
  build:
    needs: unit
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.unit.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 image/ci.py --release ${{ matrix.release }} --variant ${{ matrix.variant }} --architecture ${{ matrix.architecture }} --scope full --output "$RUNNER_TEMP/images"
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage exact tested image identities
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: >-
          python3 image/publish.py stage --release ${{ matrix.release }}
          --report "$RUNNER_TEMP/images/full/check-report.json" --variant ${{ matrix.variant }}
          --architecture ${{ matrix.architecture }} --revision "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/candidate/candidate.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: images-${{ matrix.release }}-${{ matrix.variant }}-${{ matrix.architecture }}
          path: |
            artifacts/**/build-report.json
            artifacts/**/check-report.json
            artifacts/**/*.log
            ${{ runner.temp }}/images
            ${{ runner.temp }}/candidate
          retention-days: 14
  promote:
    # Each selected release is promoted on its own: a release with a failed
    # cohort stays unpublished without blocking the others, and the job fails.
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish && needs.unit.result == 'success'
    needs: [unit, build]
    # Selections can overlap ("20.2.4" and "all" both rewrite 20.2.4's
    # tags), so every promotion, on any branch, takes one lock: a run's tag
    # writes, readback and health check never interleave with another's.
    # A second waiting promotion replaces the first one, which is cancelled.
    concurrency:
      group: images-promotion
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: images-*
          path: candidates
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote each complete release and check its registry indexes
        env:
          RELEASES: ${{ needs.unit.outputs.releases }}
        run: |
          output="$RUNNER_TEMP/promotions"
          incomplete=()
          for release in $(jq -r '.[]' <<<"$RELEASES"); do
            mkdir -p "$output/$release/candidates"
            for artifact in candidates/images-"$release"-*; do
              if [ -d "$artifact" ]; then cp -R "$artifact" "$output/$release/candidates/"; fi
            done
            if python3 image/publish.py promote --release "$release" --candidates "$output/$release/candidates" \
                --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
                --output "$output/$release/promotion.json" > "$output/$release/promotion.log" 2>&1 &&
              python3 image/publish.py health --promotion "$output/$release/promotion.json" \
                >> "$output/$release/promotion.log" 2>&1; then
              echo "Published and verified: $release"
            else
              incomplete+=("$release")
              echo "::error::Publication incomplete: $release"
              tail -n 20 "$output/$release/promotion.log"
            fi
            rm -rf "$output/$release/candidates"
          done
          printf '%s\n' "${incomplete[@]}" > "$output/incomplete.txt"
          [ "${#incomplete[@]}" -eq 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promotions
          path: ${{ runner.temp }}/promotions/
          retention-days: 30
          if-no-files-found: warn
